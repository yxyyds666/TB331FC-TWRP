name: Build TWRP for TB331FC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # twrp-14.1 AOSP minimal manifest: includes build/release project (release
  # config map) + TeamWin recovery/build overrides via twrp-default.xml
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-14.1
  # Stock-compatible GKI kernel release (TB331FC-Kernel)
  KERNEL_REPO: yxyyds666/TB331FC-Kernel
  DEVICE_NAME: TB331FC
  DEVICE_PATH: device/lenovo/TB331FC

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ubuntu-22.04 runner has ~14GB free on / and 16GB RAM; Soong's
      # whole-tree analysis OOMs the runner cgroup (runner loses
      # communication with server). Use the larger /mnt disk, add swap,
      # and disable systemd-oomd (same fixes kansas/fox_14.1 needed).
      - name: Relocate build dir to /mnt and disable OOM killer
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo systemctl mask --now systemd-oomd.service systemd-oomd.socket || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg \
            gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev lib32z1-dev lib32ncurses-dev lib32readline-dev \
            libc6-dev-i386 lib32gcc-s1 lib32stdc++6 python3 python3-pip unzip

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Set up ccache
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache -M 6G
          ccache -o compression=true
          ccache -z

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-twrp-${{ runner.os }}-${{ github.ref }}-
            ccache-twrp-${{ runner.os }}-

      - name: Install mkbootimg
        run: |
          mkdir -p /tmp/boottools
          curl -sL -o /tmp/boottools/unpack_bootimg.py https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-22.1/unpack_bootimg.py
          chmod +x /tmp/boottools/unpack_bootimg.py
          sudo ln -sf /tmp/boottools/unpack_bootimg.py /usr/local/bin/unpack_bootimg
          unpack_bootimg --help

      - name: Initialize repo (twrp-14)
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown "$(id -u):$(id -g)" /mnt/workspace
          ln -sfn /mnt/workspace workspace
          cd workspace
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@localhost"
          repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}

      - name: Sync source
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle

      - name: Copy device tree into workspace
        run: |
          mkdir -p workspace/${{ env.DEVICE_PATH }}
          cp -r ${{ env.DEVICE_PATH }}/* workspace/${{ env.DEVICE_PATH }}/

      # TeamWin vendor/twrp android-14.1 kernel.mk has a tab-indented
      # "$(call twrp-depmod)" outside any rule -> "commands commence
      # before first target". depmod is already done by our own
      # prebuilt/Android.mk, so remove the stale call.
      - name: Patch TeamWin kernel.mk (upstream tab bug)
        run: |
          cd workspace
          sed -i '/^[[:space:]]*\$(call twrp-depmod)$/d' vendor/twrp/build/tasks/kernel.mk
          grep -n "twrp-depmod" vendor/twrp/build/tasks/kernel.mk && \
            (echo "::warning::twrp-depmod still present in kernel.mk"; grep -n -B2 -A2 "twrp-depmod" vendor/twrp/build/tasks/kernel.mk) || \
            echo "patched: stale depmod call removed"

      # TeamWin system/vold android-14.1 regressed the fscrypt_policy API in
      # 2022: the union fscrypt_policy type and get_policy_size() helpers that
      # libtar (android-14.1 recovery) calls were removed. Restore them from
      # the android-12.1 branch (still the latest working API).
      - name: Patch system/vold fscrypt API (upstream regression)
        run: |
          cd workspace
          python3 ${{ env.DEVICE_PATH }}/patch-vold-fscrypt.py
          echo "patched: vold fscrypt union API restored"

      - name: Download latest kernel release (boot-main.img)
        run: |
          RELEASE_URL=$(curl -s "https://api.github.com/repos/${{ env.KERNEL_REPO }}/releases/latest" | grep -oP '"browser_download_url": "\K[^"]*boot-main\.img' | head -1)
          if [ -z "${RELEASE_URL}" ]; then
            echo "::error::No boot-main.img in latest release of ${{ env.KERNEL_REPO }}"
            exit 1
          fi
          echo "Downloading: ${RELEASE_URL}"
          curl -L -o /tmp/boot-main.img "${RELEASE_URL}"

      - name: Extract kernel Image from boot-main.img
        run: |
          unpack_bootimg --boot_img /tmp/boot-main.img --out /tmp/boot_extract
          if [ ! -f /tmp/boot_extract/kernel ]; then
            echo "::error::kernel not found in boot-main.img"
            ls -la /tmp/boot_extract || true
            exit 1
          fi
          ls -la /tmp/boot_extract/kernel
          cp /tmp/boot_extract/kernel workspace/${{ env.DEVICE_PATH }}/prebuilt/kernel

      # The minimal TWRP manifest does not generate all AIDL NDK platform
      # libraries. With TW_INCLUDE_CRYPTO_FBE=true, libtar links against
      # several android.security/system AIDL libs that are absent, causing
      # ninja to fail at link time:
      #   ninja: 'android.security.apc-ndk_platform.so.toc', needed by
      #   'libtar.so', missing and no known rule to make it
      # Create empty stubs so the linker can proceed.
      - name: Create stubs for missing AIDL ndk_platform libraries
        run: |
          PRODUCT_OUT="out/target/product/${{ env.DEVICE_NAME }}"
          MISSING_LIBS=(
            android.security.apc-ndk_platform
            android.system.keystore2-V1-ndk_platform
            android.security.authorization-ndk_platform
            android.security.maintenance-ndk_platform
          )
          # 64-bit (obj) and 32-bit (obj_arm) variants both need stubs
          for ARCH_DIR in obj obj_arm; do
            for lib in "${MISSING_LIBS[@]}"; do
              LIB_DIR="${PRODUCT_OUT}/${ARCH_DIR}/SHARED_LIBRARIES/${lib}_intermediates"
              mkdir -p "$LIB_DIR"
              touch "${LIB_DIR}/${lib}.so"
              touch "${LIB_DIR}/${lib}.so.toc"
              echo "Created stub for ${ARCH_DIR}/${lib}"
            done
          done
        working-directory: workspace

      - name: Build TWRP
        run: |
          set -o pipefail
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          # TeamWin android-14.1 build requires <product>-<release>-<variant>
          # (release validated against release_config_map, try common ones)
          LUNCH_OK=0
          for RELEASE in "ap2a" "ap3a" "trunk_staging" "trunk"; do
            COMBO="twrp_${{ env.DEVICE_NAME }}-${RELEASE}-eng"
            echo "Trying lunch combo: $COMBO"
            if lunch "$COMBO"; then
              echo "lunch OK: $COMBO"
              LUNCH_OK=1
              break
            fi
          done
          if [ "$LUNCH_OK" -ne 1 ]; then
            echo "::error::no valid lunch combo found"
            lunch 2>&1 | grep "twrp_" | head -20 || true
            exit 1
          fi
          ccache -s
          # 16GB RAM runner: cap parallel jobs to avoid OOM (Soong analysis
          # alone peaks >12GB). 2 jobs keeps the runner alive.
          JOB_COUNT=2
          # Dedicated recovery partition (not recovery-as-boot)
          mka recoveryimage -j${JOB_COUNT} 2>&1 | tee /tmp/build.log
          if [ ! -f out/target/product/${{ env.DEVICE_NAME }}/recovery.img ]; then
            echo "recovery.img missing, trying bootimage"
            mka bootimage -j${JOB_COUNT} 2>&1 | tee -a /tmp/build.log
          fi
          ccache -s

      - name: Locate and verify output
        run: |
          cd workspace
          FOUND=""
          for f in recovery.img boot.img; do
            if [ -f out/target/product/${{ env.DEVICE_NAME }}/$f ]; then
              FOUND="$f"
              echo "FOUND=$f" >> $GITHUB_ENV
              break
            fi
          done
          IMG=out/target/product/${{ env.DEVICE_NAME }}/${FOUND}
          if [ -z "${FOUND}" ] || [ ! -f "${IMG}" ]; then
            echo "::error::no recovery/boot img found"
            ls -la out/target/product/${{ env.DEVICE_NAME }}/ 2>&1 | tail -20
            tail -50 /tmp/build.log
            exit 1
          fi
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%H%M)" >> $GITHUB_ENV
          echo "MD5_IMG=$(md5sum ${IMG} | cut -d ' ' -f 1)" >> $GITHUB_ENV
          ls -la ${IMG}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ env.FOUND }}
          name: "TWRP for ${{ env.DEVICE_NAME }} (${{ env.BUILD_DATE }})"
          tag_name: "twrp-${{ env.BUILD_DATE }}-${{ env.BUILD_TIME }}"
          body: |
            ### TWRP Recovery for Lenovo Xiaoxin Pad 2024 (TB331FC)
            **Build:** ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
            **Kernel:** GKI 5.15.167 (stock KMI compatible)

            **Flash to recovery partition (both slots):**
            ```
            fastboot flash recovery_a ${{ env.FOUND }}
            fastboot flash recovery_b ${{ env.FOUND }}
            ```

            **MD5:** `${{ env.MD5_IMG }}`
